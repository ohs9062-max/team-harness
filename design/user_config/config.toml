# th — global configuration
# Applies to all projects unless overridden by a project-level .team-harness/config.toml.

[coordinator]
# Reuse the codex CLI's own subscription login for the coordinator's LLM
# calls, so no separate API key/billing is needed (requires `codex login`
# to already be done in the shell). See design/decisions.md if this repo
# has it; otherwise: the coordinator calls OpenAI's backend with the token
# from ~/.codex/auth.json instead of OPENAI_API_KEY/OPENROUTER_API_KEY.
provider = "codex"

# Workers the coordinator may spawn: claude, codex, antigravity (agy) only.
allowed_agents = ["codex", "claude", "antigravity"]

# Appended to the end of every spawned worker's prompt (any agent_type),
# after the coordinator's own task text. See worker_suffix.md next to this
# file — a standing "verify before acting" checklist for avoiding destructive
# writes and wrong-target mistakes.
worker_suffix_file = "worker_suffix.md"

# Additive text appended after the built-in coordinator base prompt.
# This does NOT replace coordinator_system_message_file / the default prompt.
system_prompt = """
## Coordinator policy: minimize tokens and preserve task state

- Use the affordable, most efficient number of workers; there is no fixed
  worker-count cap. Preserve each task in the registry so token use and state
  are not forgotten.
- Put code and logic work in a worker brief. The coordinator verifies results
  and writes directly only when needed.
- A long-running worker detaches the main job, writes its PID to `job.pid`,
  appends stage changes to `STATUS`, keeps a current `WORKLOG.md`, and ends
  with `DONE` or `FAILED` plus a reason. Chat output alone is never completion.
- Normal progress never wakes the coordinator. `th-watch` emits one event and
  exits only for completion, failure, quota/capacity worker error, missing
  process, or a stall. Run `th-status` once only when status is requested.
  Missing processes are detected within one minute; no CPU and output-file
  change for ten minutes is a stall.
- Do not accept a worker conclusion as the project conclusion. Before adopting
  a training or comparison result, check a stated baseline (such as the
  pre-training score) and whether the result is plausible. Record a failed
  method separately from the model/result it measured.
- Policy changes apply only to newly launched workers. `th-launch` reads and
  appends the current `worker_suffix.md`; let running workers finish first.

## Worker choice (manual, not automatic routing)

- `agy` has ample token headroom but greater shortcut or false-completion risk.
  Use it for simple or bulk work, and verify doubtful completion.
- For Codex: truly important work uses `gpt-5.6-sol` with low effort;
  medium-importance work uses `gpt-5.6-terra` with high effort; the default is
  `gpt-5.6-terra` with medium effort.
"""
